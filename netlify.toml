[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://youx.ai.studio/*"
  to = "https://syomax.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://syomax.ai.studio/*"
  to = "https://syomax.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.syomax.com/*"
  to = "https://syomax.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
